<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ lesson.subject }} Masterclass — AuraLearn AI</title>
</head>
<body style="background: #090d16; color: #f8fafc; font-family: 'Segoe UI', system-ui, sans-serif; padding: 20px;">
    <div style="max-width: 600px; margin: 2rem auto; background: #0f172a; border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 24px; box-shadow: 0 25px 50px rgba(0,0,0,0.7);">
        <a href="/" style="color: #f59e0b; text-decoration: none; font-weight: 700; display: inline-block; margin-bottom: 15px;">← Back to Dashboard</a>
        
        <h2 style="color: white; margin-bottom: 4px; font-size: 1.4rem;">{{ lesson.subject }}</h2>
        <h4 style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px;">{{ lesson.title }}</h4>

        <div style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 24px; backdrop-filter: blur(12px); color: #f8fafc; line-height: 1.7; font-size: 0.95rem;">
            {{ lesson.content | safe }}
        </div>
    </div>
</body>
</html>
